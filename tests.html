<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Carjack — tests</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 24px;
    background: #0d1014; color: #e6e9ee;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  h1 { font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; color: #9aa3ae; font-weight: 600; }
  .row { display: flex; gap: 10px; padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .tag { width: 52px; flex: none; font-weight: 700; }
  .pass { color: #7ee081; }
  .fail { color: #ff6b6b; }
  .name { flex: 1; }
  .detail { color: #7c858f; font-size: 12px; }
  #summary { margin-top: 18px; font-size: 14px; font-weight: 700; }
</style>
</head>
<body>
<h1>Carjack — assertion suite</h1>
<div id="out"></div>
<div id="summary">running…</div>

<script src="src/config.js"></script>
<script src="src/math.js"></script>
<script src="src/alert.js"></script>
<script src="map/city.js"></script>
<script src="src/world.js"></script>
<script src="src/camera.js"></script>
<script src="src/blood.js"></script>
<script src="src/peds.js"></script>
<script src="src/bullet.js"></script>
<script src="src/car.js"></script>
<script src="src/player.js"></script>
<script src="src/police.js"></script>
<script src="src/cleaner.js"></script>
<script>
(function () {
  'use strict';

  var M = CJ.M;
  var out = document.getElementById('out');
  var pass = 0, fail = 0;

  function assert(name, cond, detail) {
    var ok = !!cond;
    if (ok) pass++; else fail++;
    var row = document.createElement('div');
    row.className = 'row';
    row.innerHTML =
      '<span class="tag ' + (ok ? 'pass' : 'fail') + '">' + (ok ? 'PASS' : 'FAIL') + '</span>' +
      '<span class="name">' + name + '</span>' +
      '<span class="detail">' + (detail === undefined ? '' : detail) + '</span>';
    out.appendChild(row);
  }

  function near(a, b, eps) { return Math.abs(a - b) <= (eps || 1e-6); }

  // A stand-alone world with hand-placed boxes: physics tests must not depend
  // on the real city layout.
  function fakeWorld(solids) {
    return {
      w: 2000, h: 2000, solids: solids,
      solidsNear: function (x, y, r) {
        var o = [];
        for (var i = 0; i < solids.length; i++) {
          var b = solids[i];
          if (x + r < b.x || x - r > b.x + b.w) continue;
          if (y + r < b.y || y - r > b.y + b.h) continue;
          o.push(b);
        }
        return o;
      },
      isSolidAt: function (x, y, r) {
        var n = this.solidsNear(x, y, r);
        for (var i = 0; i < n.length; i++) {
          if (M.circleVsAABB(x, y, r, n[i])) return true;
        }
        return false;
      }
    };
  }

  // ---------------------------------------------------------------- math
  assert('clamp', M.clamp(5, 0, 3) === 3 && M.clamp(-5, 0, 3) === 0);
  assert('lerp', near(M.lerp(0, 10, 0.25), 2.5));
  assert('sign', M.sign(-2) === -1 && M.sign(0) === 0 && M.sign(9) === 1);
  assert('norm unit length', near(M.len(M.norm(3, 4).x, M.norm(3, 4).y), 1));
  assert('hash2 in range + stable',
    M.hash2(3, 7) === M.hash2(3, 7) && M.hash2(3, 7) >= 0 && M.hash2(3, 7) <= 1);

  // ---------------------------------------------------------------- circle vs AABB
  var box = { x: 0, y: 0, w: 10, h: 10 };
  assert('circleVsAABB: clear', M.circleVsAABB(20, 5, 3, box) === null);
  assert('circleVsAABB: touching', M.circleVsAABB(12, 5, 3, box) !== null);
  assert('circleVsAABB: just clear', M.circleVsAABB(13.01, 5, 3, box) === null);

  var hit = M.circleVsAABB(12, 5, 3, box);
  assert('circleVsAABB: normal points away',
    hit && near(hit.nx, 1) && near(hit.ny, 0) && near(hit.depth, 1),
    hit ? 'n=(' + hit.nx + ',' + hit.ny + ') d=' + hit.depth.toFixed(2) : 'null');

  var inside = M.circleVsAABB(1, 5, 3, box);
  assert('circleVsAABB: centre inside pushes out',
    inside && near(inside.nx, -1) && near(inside.depth, 4),
    inside ? 'n=(' + inside.nx + ',' + inside.ny + ') d=' + inside.depth : 'null');

  var corner = M.circleVsAABB(11, 11, 3, box);
  assert('circleVsAABB: corner normal is diagonal',
    corner && corner.nx > 0.5 && corner.ny > 0.5);

  // ---------------------------------------------------------------- segment vs AABB
  assert('segVsAABB: through', M.segVsAABB(-20, 5, 20, 5, box) >= 0);
  assert('segVsAABB: miss', M.segVsAABB(-20, 50, 20, 50, box) === -1);
  assert('segVsAABB: stops short', M.segVsAABB(-20, 5, -5, 5, box) === -1);
  assert('segVsAABB: vertical', M.segVsAABB(5, -20, 5, 20, box) >= 0);

  var t = M.segVsAABB(-20, 5, 20, 5, box);
  assert('segVsAABB: entry parameter', near(t, 20 / 40, 1e-6), 't=' + t);

  // ---------------------------------------------------------------- circle vs circle
  assert('circleVsCircle: overlap', M.circleVsCircle(0, 0, 5, 6, 0, 5) !== null);
  assert('circleVsCircle: apart', M.circleVsCircle(0, 0, 5, 30, 0, 5) === null);

  // ---------------------------------------------------------------- world parse
  var world = CJ.World;
  world.init(CJ.MAP_CITY);

  assert('world: 64x64 tiles', world.cols === 64 && world.rows === 64,
    world.cols + 'x' + world.rows);
  assert('world: pixel size', world.w === 64 * CJ.CFG.TILE && world.h === 64 * CJ.CFG.TILE,
    world.w + 'x' + world.h);
  assert('world: merged solids exist', world.solids.length > 200, world.solids.length + ' boxes');

  var rowLens = {};
  for (var i = 0; i < CJ.MAP_CITY.rows.length; i++) rowLens[CJ.MAP_CITY.rows[i].length] = 1;
  assert('world: every row is the same width', Object.keys(rowLens).length === 1,
    Object.keys(rowLens).join(','));

  assert('world: player spawn is walkable',
    !world.isSolidAt(world.playerSpawn.x, world.playerSpawn.y, CJ.CFG.P_RADIUS),
    world.playerSpawn.x + ',' + world.playerSpawn.y);

  assert('world: car spawns exist', world.carSpawns.length === CJ.MAP_CITY.cars.length,
    world.carSpawns.length + ' cars');

  assert('world: car spawns are not inside walls', world.carSpawns.every(function (c) {
    return !world.isSolidAt(c.x, c.y, CJ.CFG.CAR_RADIUS);
  }));

  // ---------------------------------------------------------------- car physics
  var flat = fakeWorld([]);
  var a = new CJ.Car({ x: 100, y: 100, h: 0 });
  for (i = 0; i < 600; i++) { a.update(CJ.CFG.DT, { throttle: 1, steer: 0 }); a.integrate(CJ.CFG.DT, flat); }
  var b = new CJ.Car({ x: 100, y: 100, h: 0 });
  for (i = 0; i < 600; i++) { b.update(CJ.CFG.DT, { throttle: 1, steer: 0 }); b.integrate(CJ.CFG.DT, flat); }
  assert('car: deterministic over 600 steps',
    near(a.x, b.x, 1e-9) && near(a.y, b.y, 1e-9), 'x=' + a.x.toFixed(3));

  assert('car: accelerates forward', a.x > 100 + 200, 'x=' + a.x.toFixed(0));
  assert('car: holds its lane when not steering', near(a.y, 100, 0.5), 'y=' + a.y.toFixed(2));

  var top = new CJ.Car({ x: 100, y: 100, h: 0 });
  for (i = 0; i < 1200; i++) top.update(CJ.CFG.DT, { throttle: 1, steer: 0 });
  assert('car: top speed clamped', near(top.speed, CJ.CFG.CAR_MAX, 0.5), top.speed.toFixed(1));

  var rev = new CJ.Car({ x: 500, y: 500, h: 0 });
  for (i = 0; i < 600; i++) { rev.update(CJ.CFG.DT, { throttle: -1, steer: 0 }); rev.integrate(CJ.CFG.DT, flat); }
  assert('car: reverses', rev.x < 500, 'x=' + rev.x.toFixed(0));

  var still = new CJ.Car({ x: 300, y: 300, h: 0 });
  still.update(CJ.CFG.DT, { throttle: 0, steer: 1 });
  assert('car: cannot steer while stopped', still.heading === 0);

  var turner = new CJ.Car({ x: 300, y: 300, h: 0 });
  for (i = 0; i < 30; i++) { turner.update(CJ.CFG.DT, { throttle: 1, steer: 1 }); turner.integrate(CJ.CFG.DT, flat); }
  assert('car: steering changes heading', turner.heading > 0.3, 'h=' + turner.heading.toFixed(2));

  // ---------------------------------------------------------------- car lights
  var lamp = new CJ.Car({ x: 0, y: 0, h: 0 });
  assert('car: headlights are off while parked', lamp.lightsOn() === false);
  lamp.driver = { x: 0, y: 0 };
  assert('car: headlights come on while driven', lamp.lightsOn() === true);
  lamp.driver = null;
  assert('car: headlights go off after getting out', lamp.lightsOn() === false);

  // ---------------------------------------------------------------- car vs wall
  var wall = fakeWorld([{ x: 500, y: 0, w: 64, h: 1000, kind: 'building' }]);
  var crasher = new CJ.Car({ x: 100, y: 500, h: 0 });
  for (i = 0; i < 900; i++) { crasher.update(CJ.CFG.DT, { throttle: 1, steer: 0 }); crasher.integrate(CJ.CFG.DT, wall); }
  var nose = crasher.x + CJ.CFG.CAR_LEN / 2;
  assert('car: does not tunnel through a wall at full speed', nose <= 501,
    'nose x=' + nose.toFixed(2));
  assert('car: not intersecting the wall',
    !wall.isSolidAt(crasher.x, crasher.y, CJ.CFG.CAR_RADIUS - 1));

  // ---------------------------------------------------------------- player vs wall
  var pw = fakeWorld([{ x: 500, y: 0, w: 64, h: 1000, kind: 'building' }]);
  var pl = new CJ.Player(400, 500);
  for (i = 0; i < 300; i++) pl.update(CJ.CFG.DT, { x: 1, y: 0 }, pw);
  assert('player: blocked by a wall',
    pl.x + CJ.CFG.P_RADIUS <= 500.5 && !pw.isSolidAt(pl.x, pl.y, CJ.CFG.P_RADIUS - 1),
    'x=' + pl.x.toFixed(2));

  var pw2 = fakeWorld([{ x: 500, y: 500, w: 64, h: 64, kind: 'building' }]);
  var pl2 = new CJ.Player(400, 400);
  for (i = 0; i < 300; i++) pl2.update(CJ.CFG.DT, { x: 0.7071, y: 0.7071 }, pw2);
  assert('player: slides past a corner without sticking',
    !pw2.isSolidAt(pl2.x, pl2.y, CJ.CFG.P_RADIUS - 1),
    'pos=' + pl2.x.toFixed(1) + ',' + pl2.y.toFixed(1));

  var pl3 = new CJ.Player(10, 10);
  for (i = 0; i < 300; i++) pl3.update(CJ.CFG.DT, { x: -1, y: -1 }, flat);
  assert('player: clamped to world bounds',
    pl3.x >= CJ.CFG.P_RADIUS - 0.01 && pl3.y >= CJ.CFG.P_RADIUS - 0.01,
    'pos=' + pl3.x.toFixed(1) + ',' + pl3.y.toFixed(1));

  // ---------------------------------------------------------------- bullets
  CJ.Bullets.clear();
  var bw = fakeWorld([{ x: 300, y: 0, w: 64, h: 1000, kind: 'building' }]);
  CJ.Bullets.spawn(100, 500, 0, null);
  for (i = 0; i < 60 && CJ.Bullets.liveCount > 0; i++) CJ.Bullets.update(CJ.CFG.DT, bw, [], null);
  assert('bullets: destroyed by a wall', CJ.Bullets.liveCount === 0);

  CJ.Bullets.clear();
  CJ.Bullets.spawn(100, 500, 0, null);
  for (i = 0; i < 6; i++) CJ.Bullets.update(CJ.CFG.DT, flat, [], null);
  assert('bullets: survive in open space', CJ.Bullets.liveCount === 1);

  CJ.Bullets.clear();
  var bulletTarget = { x: 220, y: 500, hp: 100 };
  CJ.Bullets.spawn(100, 500, 0, null);
  var hitCalled = 0;
  for (i = 0; i < 30 && CJ.Bullets.liveCount > 0; i++) {
    CJ.Bullets.update(CJ.CFG.DT, flat, [bulletTarget], function () { hitCalled++; });
  }
  assert('bullets: hit a car exactly once', hitCalled === 1 && CJ.Bullets.liveCount === 0,
    'hits=' + hitCalled);

  CJ.Bullets.clear();
  CJ.Bullets.spawn(100, 500, 0, null);
  for (i = 0; i < 200; i++) CJ.Bullets.update(CJ.CFG.DT, flat, [], null);
  assert('bullets: expire after ttl', CJ.Bullets.liveCount === 0);

  CJ.Bullets.clear();
  var shooter = { x: 100, y: 500 };
  CJ.Bullets.spawn(100, 500, 0, shooter);
  var selfHit = 0;
  for (i = 0; i < 10; i++) {
    CJ.Bullets.update(CJ.CFG.DT, flat, [shooter], function () { selfHit++; });
  }
  assert('bullets: never hit their owner', selfHit === 0);
  CJ.Bullets.clear();

  // ---------------------------------------------------------------- blood
  CJ.Blood.clear();
  assert('blood: starts empty', CJ.Blood.count === 0);

  CJ.Blood.add(500, 500, 1, 0);
  assert('blood: a splat is recorded', CJ.Blood.count === 1);
  assert('blood: splat has blobs', CJ.Blood.splats[0].blobs.length >= 8,
    CJ.Blood.splats[0].blobs.length + ' blobs');
  assert('blood: splat is anchored where it was added',
    CJ.Blood.splats[0].x === 500 && CJ.Blood.splats[0].y === 500);

  for (i = 0; i < CJ.CFG.SPLAT_MAX + 40; i++) CJ.Blood.add(600 + i, 500, 0, 1);
  assert('blood: decal count is capped', CJ.Blood.count === CJ.CFG.SPLAT_MAX,
    CJ.Blood.count + ' splats');

  // Blobs must smear in the impact direction.
  CJ.Blood.clear();
  CJ.Blood.add(1000, 1000, 1, 0);
  var smearSum = 0;
  var blobs0 = CJ.Blood.splats[0].blobs;
  for (i = 0; i < blobs0.length; i++) smearSum += blobs0[i].x;
  assert('blood: spray smears along the impact direction', smearSum > 0,
    'sum dx=' + smearSum.toFixed(1));
  CJ.Blood.clear();

  // ---------------------------------------------------------------- peds
  CJ.Peds.init(world, CJ.MAP_CITY);
  assert('peds: sidewalk routes discovered', CJ.Peds.loops.length > 10,
    CJ.Peds.loops.length + ' loops');

  var routeOk = CJ.Peds.loops.every(function (loop) {
    return loop.points.length > 7;
  });
  assert('peds: every route has a full ring', routeOk);

  CJ.Peds.reset();
  assert('peds: spawns the configured count',
    CJ.Peds.list.length === CJ.CFG.PED_COUNT, CJ.Peds.list.length + ' peds');
  assert('peds: nobody starts dead', CJ.Peds.aliveCount === CJ.CFG.PED_COUNT);

  var pedInWall = 0;
  var pedOutOfBounds = 0;
  for (i = 0; i < CJ.Peds.list.length; i++) {
    var pd = CJ.Peds.list[i];
    if (world.isSolidAt(pd.x, pd.y, pd.r)) pedInWall++;
    if (pd.x < 0 || pd.y < 0 || pd.x > world.w || pd.y > world.h) pedOutOfBounds++;
  }
  assert('peds: none spawn inside a building', pedInWall === 0, pedInWall + ' stuck');
  assert('peds: none spawn outside the world', pedOutOfBounds === 0);

  // Peds actually walk, and stay out of walls while doing it.
  var walker = CJ.Peds.list[0];
  var wx = walker.x, wy = walker.y;
  for (i = 0; i < 120; i++) CJ.Peds.update(CJ.CFG.DT, world, []);
  assert('peds: they move around', CJ.M.dist(wx, wy, walker.x, walker.y) > 5,
    'moved ' + CJ.M.dist(wx, wy, walker.x, walker.y).toFixed(1) + 'px');

  var strayed = 0;
  for (i = 0; i < CJ.Peds.list.length; i++) {
    var q = CJ.Peds.list[i];
    if (q.state === 'inside') continue;
    if (world.isSolidAt(q.x, q.y, q.r - 1)) strayed++;
  }
  assert('peds: never walk into buildings', strayed === 0, strayed + ' inside walls');

  // The door state machine: force a ped to enter, then make sure it comes back.
  var doorman = CJ.Peds.list[0];
  doorman.loop = CJ.Peds.loops.filter(function (l) { return l.doors.length > 0; })[0] || doorman.loop;
  doorman.state = 'entering';
  doorman.timer = CJ.CFG.PED_FADE_TIME;
  doorman.fade = 1;
  for (i = 0; i < 40; i++) doorman.update(CJ.CFG.DT, world, []);
  assert('peds: fade into a house', doorman.state === 'inside' && doorman.fade === 0,
    doorman.state + ' fade=' + doorman.fade);

  // Track the whole cycle rather than the final state: a ped can legitimately
  // walk to the next door and go back inside again.
  var cameOut = false;
  var maxFade = 0;
  for (i = 0; i < 60 * 12; i++) {
    doorman.update(CJ.CFG.DT, world, []);
    if (doorman.state === 'exiting' || doorman.state === 'walk') cameOut = true;
    if (doorman.fade > maxFade) maxFade = doorman.fade;
  }
  assert('peds: come back out of a house', cameOut);
  assert('peds: reappear fully visible', maxFade > 0.99, 'max fade=' + maxFade.toFixed(2));
  assert('peds: end up on a walkable tile',
    doorman.state === 'inside' || !world.isSolidAt(doorman.x, doorman.y, doorman.r - 1),
    doorman.state + ' @ ' + doorman.x.toFixed(0) + ',' + doorman.y.toFixed(0));

  // Kills leave blood behind.
  CJ.Blood.clear();
  var victim = CJ.Peds.list[1];
  var killed = victim.kill(1, 0);
  assert('peds: kill() reports the death', killed === true);
  assert('peds: the dead ped is flagged', victim.dead === true);
  assert('peds: a kill leaves a splat', CJ.Blood.count === 1);
  assert('peds: killing twice is a no-op', victim.kill(1, 0) === false);
  assert('peds: blood count did not double', CJ.Blood.count === 1);
  assert('peds: alive count drops', CJ.Peds.aliveCount === CJ.CFG.PED_COUNT - 1);

  // A fast car flattens; a slow one just shoves.
  CJ.Blood.clear();
  var runner = CJ.Peds.list[2];
  runner.state = 'walk';
  runner.x = 900;
  runner.y = 900;
  var slowCar = new CJ.Car({ x: 900, y: 900, h: 0 });
  slowCar.vx = 10;
  var flatSlow = CJ.Peds.hitByCar(slowCar);
  assert('peds: a crawling car does not kill', flatSlow === 0 && !runner.dead);

  var fastCar = new CJ.Car({ x: 900, y: 900, h: 0 });
  fastCar.vx = 400;
  var flatFast = CJ.Peds.hitByCar(fastCar);
  assert('peds: a fast car runs them over', flatFast === 1 && runner.dead);
  assert('peds: running someone over leaves blood', CJ.Blood.count === 1);

  // Bullets can kill peds through the optional ped arguments.
  CJ.Blood.clear();
  var shootee = CJ.Peds.list[3];
  shootee.state = 'walk';
  shootee.x = 1000;
  shootee.y = 700;
  CJ.Bullets.clear();
  CJ.Bullets.spawn(900, 700, 0, null);
  var pedHit = 0;
  for (i = 0; i < 20 && CJ.Bullets.liveCount > 0; i++) {
    CJ.Bullets.update(CJ.CFG.DT, world, [], null, CJ.Peds.targets(),
      function (p) { pedHit++; p.kill(1, 0); });
  }
  assert('bullets: a bullet can kill a pedestrian', pedHit === 1 && shootee.dead,
    'hits=' + pedHit);
  assert('bullets: shooting someone leaves blood', CJ.Blood.count === 1);
  CJ.Bullets.clear();
  CJ.Blood.clear();

  // ---------------------------------------------------------------- money
  assert('charge: deducts the amount', M.charge(100, 25) === 75, String(M.charge(100, 25)));
  assert('charge: floors at zero', M.charge(10, 25) === 0, String(M.charge(10, 25)));
  assert('charge: exactly zero stays zero', M.charge(25, 25) === 0);
  assert('charge: never negative from zero', M.charge(0, 25) === 0);
  assert('charge: negative amounts do not add money', M.charge(50, -10) === 50,
    String(M.charge(50, -10)));
  assert('charge: survives nonsense balances', M.charge(NaN, 25) === 0);
  assert('charge: a long losing streak stays at zero', (function () {
    var bal = 100;
    for (var n = 0; n < 20; n++) bal = M.charge(bal, 25);
    return bal === 0;
  })());

  // ---------------------------------------------------------------- blast damage
  assert('blastDamage: point blank is the full amount',
    M.blastDamage(0, 200, 30) === 30, String(M.blastDamage(0, 200, 30)));
  assert('blastDamage: half radius is half damage',
    near(M.blastDamage(100, 200, 30), 15, 1e-9));
  assert('blastDamage: at the edge is zero', M.blastDamage(200, 200, 30) === 0);
  assert('blastDamage: beyond the edge is zero', M.blastDamage(500, 200, 30) === 0);
  assert('blastDamage: never negative', M.blastDamage(-50, 200, 30) === 30);

  var prev = Infinity;
  var monotonic = true;
  for (var bd = 0; bd <= 200; bd += 10) {
    var cur = M.blastDamage(bd, 200, 30);
    if (cur > prev) monotonic = false;
    prev = cur;
  }
  assert('blastDamage: falls off monotonically', monotonic);

  // ---------------------------------------------------------------- special buildings
  assert('specials: world exposes a police station footprint',
    !!world.policeStation && world.policeStation.w > 0 && world.policeStation.h > 0);
  assert('specials: world exposes a hospital footprint',
    !!world.hospital && world.hospital.w > 0 && world.hospital.h > 0);
  assert('specials: they are different buildings',
    world.policeStation.x !== world.hospital.x || world.policeStation.y !== world.hospital.y);
  assert('specials: police and hospital do not overlap',
    world.policeStation.x + world.policeStation.w <= world.hospital.x ||
    world.hospital.x + world.hospital.w <= world.policeStation.x ||
    world.policeStation.y + world.policeStation.h <= world.hospital.y ||
    world.hospital.y + world.hospital.h <= world.policeStation.y);

  var policeTiles = 0, hospitalTiles = 0;
  for (var sty = 0; sty < world.rows; sty++) {
    for (var stx = 0; stx < world.cols; stx++) {
      var sc2 = world.tileChar(stx, sty);
      if (sc2 === 'P') policeTiles++;
      if (sc2 === 'H') hospitalTiles++;
    }
  }
  assert('specials: exactly one police station', policeTiles === 16, policeTiles + ' tiles');
  assert('specials: exactly one hospital', hospitalTiles === 16, hospitalTiles + ' tiles');

  var policeBoxes = 0, hospitalBoxes = 0;
  for (var si2 = 0; si2 < world.solids.length; si2++) {
    if (world.solids[si2].kind === 'police') policeBoxes++;
    if (world.solids[si2].kind === 'hospital') hospitalBoxes++;
  }
  assert('specials: one collision box each', policeBoxes === 1 && hospitalBoxes === 1,
    policeBoxes + '/' + hospitalBoxes);

  assert('specials: both are solid',
    world.isSolidAt(world.policeStation.x + world.policeStation.w / 2,
                    world.policeStation.y + world.policeStation.h / 2, 2) &&
    world.isSolidAt(world.hospital.x + world.hospital.w / 2,
                    world.hospital.y + world.hospital.h / 2, 2));

  // The hospital respawn point must be outside the hospital and walkable.
  var hs = world.hospitalSpawn;
  var insideHospital =
    hs.x > world.hospital.x && hs.x < world.hospital.x + world.hospital.w &&
    hs.y > world.hospital.y && hs.y < world.hospital.y + world.hospital.h;
  assert('specials: hospital spawn is outside the building', !insideHospital,
    hs.x.toFixed(0) + ',' + hs.y.toFixed(0));
  assert('specials: hospital spawn is walkable',
    !world.isSolidAt(hs.x, hs.y, CJ.CFG.P_RADIUS), hs.x.toFixed(0) + ',' + hs.y.toFixed(0));
  assert('specials: hospital spawn is inside the world',
    hs.x > 0 && hs.y > 0 && hs.x < world.w && hs.y < world.h);

  // ---------------------------------------------------------------- alert meter
  var perBadge = CJ.CFG.ALERT_MAX / CJ.CFG.ALERT_BADGES;
  var bait = new CJ.Alert();

  assert('alert: starts empty',
    bait.value === 0 && bait.badges() === 0 && bait.fill(0) === 0);
  assert('alert: five shields of twenty points', perBadge === 20, String(perBadge));

  bait.add(8);
  assert('alert: running someone over adds a little',
    bait.value === 8 && bait.badges() === 0, String(bait.value));
  assert('alert: the first shield is partly lit',
    near(bait.fill(0), 8 / perBadge) && bait.fill(1) === 0);

  bait.add(34);
  assert('alert: shooting adds heat', bait.value === 42, String(bait.value));
  assert('alert: two shields are lit', bait.badges() === 2, String(bait.badges()));
  assert('alert: the second badge is the chase trigger',
    bait.hot() === true && CJ.CFG.ALERT_CHASE_AT === perBadge);
  assert('alert: the third shield is a tenth lit', near(bait.fill(2), 0.1));

  bait.add(1000);
  assert('alert: caps at full',
    bait.value === CJ.CFG.ALERT_MAX && bait.badges() === CJ.CFG.ALERT_BADGES);
  assert('alert: every shield is full at the cap', bait.fill(0) === 1 && bait.fill(4) === 1);

  assert('alert: nonsense adds are ignored', (function () {
    var a = new CJ.Alert();
    a.add(NaN); a.add(-5); a.add(0);
    return a.value === 0;
  })());

  // Decay waits for the cooldown, then drains to (but not past) zero.
  var cooling = new CJ.Alert();
  cooling.add(50);
  for (i = 0; i < Math.floor(CJ.CFG.ALERT_COOLDOWN / CJ.CFG.DT) - 2; i++) {
    cooling.update(CJ.CFG.DT);
  }
  assert('alert: does not cool while the trail is hot', near(cooling.value, 50, 1e-9),
    String(cooling.value));
  for (i = 0; i < 60 * 60; i++) cooling.update(CJ.CFG.DT);
  assert('alert: drains when nothing happens', cooling.value < 50, String(cooling.value));
  assert('alert: never drains below zero', cooling.value >= 0, String(cooling.value));
  assert('alert: a new crime refreshes the cooling timer', (function () {
    var a = new CJ.Alert();
    a.add(40);
    for (var n = 0; n < CJ.CFG.ALERT_COOLDOWN / CJ.CFG.DT; n++) a.update(CJ.CFG.DT);
    a.add(0.0001);
    var before = a.value;
    for (n = 0; n < 60; n++) a.update(CJ.CFG.DT);
    return a.value === before;
  })());

  // ---------------------------------------------------------------- police
  var copSpawn = CJ.Police.spawnPoint(world);
  assert('police: the station has a road spawn', !!copSpawn,
    copSpawn ? copSpawn.x.toFixed(0) + ',' + copSpawn.y.toFixed(0) : 'none');
  assert('police: the spawn is on a road tile',
    !!copSpawn &&
    world.tileChar(Math.floor(copSpawn.x / world.tile),
                   Math.floor(copSpawn.y / world.tile)) === '=');
  var stationCx = world.policeStation.x + world.policeStation.w / 2;
  var stationCy = world.policeStation.y + world.policeStation.h / 2;
  assert('police: the spawn is close to the station',
    !!copSpawn && M.dist(copSpawn.x, copSpawn.y, stationCx, stationCy) < world.tile * 5,
    copSpawn ? M.dist(copSpawn.x, copSpawn.y, stationCx, stationCy).toFixed(0) + 'px' : 'none');

  var route = CJ.Police.findPath(world, stationCx, stationCy,
                                 world.playerSpawn.x, world.playerSpawn.y);
  assert('police: a road route to the player exists',
    !!route && route.length > 10, route ? route.length + ' waypoints' : 'none');
  var routeOnRoad = true;
  if (route) {
    for (i = 0; i < route.length; i++) {
      if (world.tileChar(Math.floor(route[i].x / world.tile),
                         Math.floor(route[i].y / world.tile)) !== '=') routeOnRoad = false;
    }
  }
  assert('police: every waypoint is on the road', routeOnRoad);
  assert('police: the route ends near the player', !!route &&
    M.dist(route[route.length - 1].x, route[route.length - 1].y,
           world.playerSpawn.x, world.playerSpawn.y) < world.tile * 4);

  var patrolCars = [];
  var baitPlayer = new CJ.Player(world.playerSpawn.x, world.playerSpawn.y);
  CJ.Police.init(world, function () {});
  CJ.Police.reset();
  CJ.Police.addHeat(CJ.CFG.ALERT_CHASE_AT);
  var dispatchSteps = Math.ceil(CJ.CFG.POLICE_CALL_DELAY / CJ.CFG.DT) + 2;
  for (i = 0; i < dispatchSteps; i++) {
    CJ.Police.update(CJ.CFG.DT, baitPlayer, patrolCars);
  }
  assert('police: the second badge dispatches a car',
    patrolCars.length === 1 && patrolCars[0].police, patrolCars.length + ' cars');
  assert('police: the squad car is faster than yours',
    patrolCars.length === 1 && patrolCars[0].maxSpeed > CJ.CFG.CAR_MAX);
  assert('police: the squad car leaves from the station',
    patrolCars.length === 1 &&
    M.dist(patrolCars[0].x, patrolCars[0].y, copSpawn.x, copSpawn.y) < 1);
  assert('police: two officers are in the car',
    CJ.Police.active && CJ.Police.snapshot().cops === 2 &&
    CJ.Police.snapshot().afoot === 0);

  CJ.Police.disengage();
  assert('police: standing down removes the car and empties the meter',
    patrolCars.length === 0 && !CJ.Police.active && CJ.Police.alert === 0);

  // ---------------------------------------------------------------- fleet
  // One squad car for every badge filled: 20 points = 1 car, 40 = 2, 60 = 3 ...
  var fleetCars = [];
  var fleetPlayer = new CJ.Player(world.playerSpawn.x, world.playerSpawn.y);
  var callSteps = Math.ceil(CJ.CFG.POLICE_CALL_DELAY / CJ.CFG.DT);
  var reinforceSteps = Math.ceil(CJ.CFG.POLICE_REINFORCE_DELAY / CJ.CFG.DT);

  function runFleet(heat, steps) {
    CJ.Police.reset();
    fleetCars.length = 0;
    CJ.Police.addHeat(heat);
    for (var n = 0; n < steps; n++) CJ.Police.update(CJ.CFG.DT, fleetPlayer, fleetCars);
  }

  runFleet(perBadge, callSteps + 4);
  assert('fleet: one filled badge sends one car', fleetCars.length === 1,
    fleetCars.length + ' cars');
  assert('fleet: a single car carries two officers',
    CJ.Police.snapshot().cops === 2, CJ.Police.snapshot().cops + ' officers');

  runFleet(perBadge * 2, callSteps + reinforceSteps + 6);
  assert('fleet: two filled badges send two cars', fleetCars.length === 2,
    fleetCars.length + ' cars');
  assert('fleet: every reinforcement is a squad car',
    fleetCars[0].police === true && fleetCars[1].police === true);
  assert('fleet: two cars bring four officers',
    CJ.Police.snapshot().cops === 4, CJ.Police.snapshot().cops + ' officers');
  assert('fleet: two cars are reported as two units',
    CJ.Police.snapshot().units === 2 && CJ.Police.snapshot().cars === 2);

  runFleet(perBadge * 3, callSteps + reinforceSteps * 2 + 8);
  assert('fleet: three filled badges send three cars', fleetCars.length === 3,
    fleetCars.length + ' cars');

  runFleet(CJ.CFG.ALERT_MAX, callSteps + reinforceSteps * 5 + 12);
  assert('fleet: a full meter sends one car per badge',
    fleetCars.length === CJ.CFG.ALERT_BADGES, fleetCars.length + ' cars');
  assert('fleet: five cars bring ten officers',
    CJ.Police.snapshot().cops === CJ.CFG.ALERT_BADGES * 2,
    CJ.Police.snapshot().cops + ' officers');
  assert('fleet: the fleet never exceeds the meter',
    CJ.Police.snapshot().wanted === CJ.CFG.ALERT_BADGES &&
    fleetCars.length <= CJ.CFG.POLICE_MAX_UNITS);

  // Reinforcements must not spawn inside the car already at the station.
  var spotA = CJ.Police.spawnPoint(world, []);
  var spotB = CJ.Police.spawnPoint(world, [spotA]);
  assert('fleet: reinforcements get their own road spot',
    !!spotA && !!spotB && M.dist(spotA.x, spotA.y, spotB.x, spotB.y) >= CJ.CFG.CAR_LEN,
    spotB ? M.dist(spotA.x, spotA.y, spotB.x, spotB.y).toFixed(0) + 'px apart' : 'none');
  assert('fleet: the second spot is still a road tile',
    world.tileChar(Math.floor(spotB.x / world.tile),
                   Math.floor(spotB.y / world.tile)) === '=');

  // Dropping one crew retires only that car, and the station tops the fleet up.
  var beforeUnits = CJ.Police.snapshot().units;
  var doomedUnit = CJ.Police.units[0];
  var doomedCops = doomedUnit.cops.length;
  var doomedCar = doomedUnit.car;
  for (i = 0; i < doomedCops; i++) CJ.Police.hitCop(doomedUnit.cops[i], 1, 0);
  CJ.Police.update(CJ.CFG.DT, fleetPlayer, fleetCars);
  assert('fleet: wiping out one crew retires only its car',
    CJ.Police.snapshot().units === beforeUnits - 1,
    CJ.Police.snapshot().units + ' units left');
  assert('fleet: the other cars keep chasing', CJ.Police.snapshot().cars >= 3,
    CJ.Police.snapshot().cars + ' cars');
  for (i = 0; i < reinforceSteps + 4; i++) {
    CJ.Police.update(CJ.CFG.DT, fleetPlayer, fleetCars);
  }
  assert('fleet: the station sends a replacement car',
    CJ.Police.snapshot().units === beforeUnits, CJ.Police.snapshot().units + ' units');

  // The crew we wiped is gone, but its squad car stayed behind to be stolen.
  assert('fleet: a wiped-out crew leaves its squad car behind',
    !!doomedCar && fleetCars.indexOf(doomedCar) !== -1 && doomedCar.abandoned === true,
    doomedCar ? (doomedCar.abandoned ? 'left in the world' : 'removed') : 'no car');
  assert('fleet: the abandoned squad car can be stolen',
    !!doomedCar && doomedCar.canEnter() === true);
  assert('fleet: a live squad car cannot be hijacked',
    new CJ.Car({ police: true }).canEnter() === false);
  assert('fleet: a sweeper is never enterable',
    new CJ.Car({ cleaner: true }).canEnter() === false);

  CJ.Police.reset();
  assert('fleet: reset clears every car', fleetCars.length === 0 && !CJ.Police.active,
    fleetCars.length + ' cars');
  assert('fleet: reset also sweeps up the abandoned squad car',
    fleetCars.indexOf(doomedCar) === -1);

  // ---------------------------------------------------------------- police bullets
  CJ.Bullets.clear();
  var victimPlayer = new CJ.Player(world.playerSpawn.x, world.playerSpawn.y);
  var playerHits = 0;
  CJ.Bullets.spawn(world.playerSpawn.x - 50, world.playerSpawn.y, 0, null);
  for (i = 0; i < 20 && CJ.Bullets.liveCount > 0; i++) {
    CJ.Bullets.update(CJ.CFG.DT, world, [], null, [], null, victimPlayer,
      function () { playerHits++; });
  }
  assert('bullets: a cop bullet can hit you on foot', playerHits === 1,
    'hits=' + playerHits);

  CJ.Bullets.clear();
  playerHits = 0;
  CJ.Bullets.spawn(victimPlayer.x - 50, victimPlayer.y, 0, victimPlayer);
  for (i = 0; i < 20 && CJ.Bullets.liveCount > 0; i++) {
    CJ.Bullets.update(CJ.CFG.DT, world, [], null, [], null, victimPlayer,
      function () { playerHits++; });
  }
  assert('bullets: your own bullet cannot hit you', playerHits === 0,
    'hits=' + playerHits);

  // ---------------------------------------------------------------- squad car
  var squad = new CJ.Car({
    x: 0, y: 0, h: 0, police: true, hp: 180, maxSpeed: 900, accel: 900
  });
  assert('car: the police flag and siren exist',
    squad.police === true && squad.siren === 0);
  assert('car: a police car keeps its lights on when unmanned',
    squad.lightsOn() === true);
  assert('car: police cars take custom chassis health', squad.hp === 180);
  for (i = 0; i < 600; i++) squad.update(CJ.CFG.DT, { throttle: 1, steer: 0 });
  assert('car: the max speed override is respected',
    near(squad.speed, 900, 1) && squad.speed > CJ.CFG.CAR_MAX,
    squad.speed.toFixed(0) + ' px/s');

  // ---------------------------------------------------------------- camera
  var cam = CJ.Camera;
  cam.setViewport(800, 600);
  cam.setTarget({ x: 0, y: 0, vx: 0, vy: 0 }, true);
  for (i = 0; i < 240; i++) cam.update(CJ.CFG.DT, world);
  assert('camera: clamped at the top-left corner', cam.x === 400 && cam.y === 300,
    cam.x + ',' + cam.y);

  cam.setTarget({ x: world.w, y: world.h, vx: 0, vy: 0 }, true);
  for (i = 0; i < 240; i++) cam.update(CJ.CFG.DT, world);
  assert('camera: clamped at the bottom-right corner',
    cam.x === world.w - 400 && cam.y === world.h - 300, cam.x + ',' + cam.y);

  var sc = cam.screenToWorld(400, 300);
  assert('camera: screen centre maps to the camera position',
    near(sc.x, cam.x) && near(sc.y, cam.y));

  // ---------------------------------------------------------------- city sanity
  var carInWall = 0;
  for (i = 0; i < world.carSpawns.length; i++) {
    var cs = world.carSpawns[i];
    if (world.isSolidAt(cs.x, cs.y, CJ.CFG.CAR_RADIUS)) carInWall++;
  }
  assert('city: no car spawn overlaps a building', carInWall === 0, carInWall + ' bad');

  // Parked cars must hug a kerb rather than straddling the middle of the lane.
  var tile = CJ.CFG.TILE;
  var blockTiles = CJ.MAP_CITY.blockSize;
  var roadW = CJ.MAP_CITY.roadWidth;
  var halfW = CJ.CFG.CAR_W / 2;
  var maxGap = -1e9, midRoad = 0, overKerb = 0;
  for (i = 0; i < world.carSpawns.length; i++) {
    var spawn = world.carSpawns[i];
    var alongX = Math.abs(Math.cos(spawn.h)) >= Math.abs(Math.sin(spawn.h));
    var across = alongX ? spawn.y : spawn.x;
    var blockStart = Math.floor(Math.floor(across / tile) / blockTiles) * blockTiles;
    var kerbLow = (blockStart + blockTiles - roadW) * tile;
    var kerbHigh = (blockStart + blockTiles) * tile;
    // Distance from whichever flank is nearest to a kerb, in px.
    var gap = Math.min(kerbHigh - (across + halfW), (across - halfW) - kerbLow);
    maxGap = Math.max(maxGap, gap);
    if (gap > tile * 0.25) midRoad++;   // parked out in the traffic lane
    if (gap < 0) overKerb++;            // mounted the pavement
  }
  assert('city: every parked car hugs a kerb', midRoad === 0,
    'widest kerb gap ' + maxGap.toFixed(1) + 'px');
  assert('city: every parked car stays inside the kerbs', overKerb === 0,
    overKerb + ' over a kerb');

  var roadCount = 0;
  for (var ty = 0; ty < world.rows; ty++) {
    for (var tx = 0; tx < world.cols; tx++) {
      if (world.tileChar(tx, ty) === '=') roadCount++;
    }
  }
  assert('city: has a street grid', roadCount > 900, roadCount + ' road tiles');

  // ---------------------------------------------------------------- street cleaners
  // A splat that lives CLEAN_DELAY seconds summons the depot's lone sweeper; it
  // drives over the blood to scrub it, so the pool drains instead of filling up
  // to SPLAT_MAX.
  CJ.Blood.clear();
  CJ.Cleaner.init(world);
  CJ.Cleaner.reset();
  var cleanerCars = [];

  assert('cleaner: the depot building sits on the map',
    !!world.depot && world.depot.kind === 'depot', world.depot ? 'found' : 'missing');
  assert('cleaner: the depot is a small building, not a whole block',
    !!world.depot && world.depot.w <= world.tile * 4 && world.depot.h <= world.tile * 4,
    world.depot ? (world.depot.w / world.tile) + 'x' + (world.depot.h / world.tile) + ' tiles'
                : 'missing');
  assert('cleaner: an ordinary car is not a sweeper',
    new CJ.Car({ x: 0, y: 0 }).cleaner === false);
  assert('cleaner: there is exactly one sweeper', CJ.CFG.CLEANER_MAX_UNITS === 1);

  var depotSpot = CJ.Cleaner.spawnPoint(world, []);
  assert('cleaner: the sweeper leaves from a road tile beside the depot',
    !!depotSpot && world.tileChar(Math.floor(depotSpot.x / world.tile),
                                  Math.floor(depotSpot.y / world.tile)) === '=',
    depotSpot ? 'on the road' : 'none');

  // The brush only scrubs the blood it actually drives over.
  CJ.Blood.clear();
  CJ.Blood.add(500, 500, 1, 0);
  CJ.Blood.add(700, 500, 1, 0);
  var scrubbed = CJ.Blood.cleanNear(500, 500, CJ.CFG.CLEANER_SWEEP_RADIUS);
  assert('cleaner: the brush scrubs only the blood under it',
    scrubbed === 1 && CJ.Blood.count === 1, scrubbed + ' scrubbed');
  CJ.Blood.clear();

  // A mess across town, so the sweeper has to actually drive out to it.
  var farSpot = CJ.Police.spawnPoint(world, []);
  CJ.Blood.add(farSpot.x, farSpot.y, 1, 0);

  var beforeDelay = Math.ceil((CJ.CFG.CLEAN_DELAY - 1) / CJ.CFG.DT);
  for (i = 0; i < beforeDelay; i++) {
    CJ.Blood.update(CJ.CFG.DT);
    CJ.Cleaner.update(CJ.CFG.DT, cleanerCars);
  }
  assert('cleaner: a fresh splat summons nobody',
    cleanerCars.length === 0 && CJ.Blood.count === 1,
    cleanerCars.length + ' sweepers, ' + CJ.Blood.count + ' splats');

  // Once it passes CLEAN_DELAY, the depot rolls the sweeper out.
  for (i = 0; i < Math.ceil(2 / CJ.CFG.DT); i++) {
    CJ.Blood.update(CJ.CFG.DT);
    CJ.Cleaner.update(CJ.CFG.DT, cleanerCars);
  }
  assert('cleaner: a 20-second-old splat sends the sweeper',
    cleanerCars.length === 1 && cleanerCars[0].cleaner === true,
    cleanerCars.length + ' sweepers');
  assert('cleaner: the sweeper is slower than your car',
    cleanerCars.length === 1 && cleanerCars[0].maxSpeed < CJ.CFG.CAR_MAX);

  // It drives over the mess and scrubs it away.
  for (i = 0; i < Math.ceil(15 / CJ.CFG.DT); i++) {
    CJ.Blood.update(CJ.CFG.DT);
    CJ.Cleaner.update(CJ.CFG.DT, cleanerCars);
  }
  assert('cleaner: the sweeper drives the splat away', CJ.Blood.count === 0,
    CJ.Blood.count + ' splats left');

  // A pile of old splats still only ever summons the one sweeper.
  CJ.Blood.clear();
  CJ.Cleaner.reset();
  cleanerCars.length = 0;
  var spots = [CJ.Cleaner.spawnPoint(world, []), CJ.Police.spawnPoint(world, []),
               { x: world.playerSpawn.x, y: world.playerSpawn.y }];
  for (i = 0; i < 12; i++) {
    var sp = spots[i % spots.length];
    CJ.Blood.add(sp.x + i * 3, sp.y, 1, 0);
  }
  for (i = 0; i < Math.ceil((CJ.CFG.CLEAN_DELAY + 2) / CJ.CFG.DT); i++) CJ.Blood.update(CJ.CFG.DT);
  for (i = 0; i < Math.ceil(3 / CJ.CFG.DT); i++) CJ.Cleaner.update(CJ.CFG.DT, cleanerCars);
  assert('cleaner: there is at most one sweeper out',
    cleanerCars.length === CJ.CFG.CLEANER_MAX_UNITS, cleanerCars.length + ' sweepers');
  assert('cleaner: the sweeper out is a sweeper',
    cleanerCars.every(function (c) { return c.cleaner === true; }));

  CJ.Cleaner.reset();
  assert('cleaner: reset recalls the sweeper',
    cleanerCars.length === 0 && !CJ.Cleaner.active);
  CJ.Blood.clear();

  // ---------------------------------------------------------------- done
  var summary = document.getElementById('summary');
  summary.textContent = pass + ' passed, ' + fail + ' failed';
  summary.className = fail === 0 ? 'pass' : 'fail';
  console.log('[carjack tests] ' + pass + ' passed, ' + fail + ' failed');

  window.__TEST_RESULT__ = { pass: pass, fail: fail };
})();
</script>
</body>
</html>
