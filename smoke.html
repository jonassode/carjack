<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Carjack — smoke test</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0d1014; color: #e6e9ee;
         font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  #game { position: fixed; inset: 0; opacity: 0.25; }
  #out { position: relative; padding: 20px; }
  .row { display: flex; gap: 10px; padding: 2px 0; }
  .tag { width: 52px; flex: none; font-weight: 700; }
  .pass { color: #7ee081; }
  .fail { color: #ff6b6b; }
  .detail { color: #7c858f; }
  #summary { margin-top: 14px; font-weight: 700; font-size: 14px; padding: 0 20px 20px; }
  #hud { display: none; }
</style>
</head>
<body>
<!-- The real game, with a minimal but complete HUD DOM so main.js can boot. -->
<canvas id="game"></canvas>
<div id="hud">
  <span id="hud-mode"></span>
  <span id="hud-speed"></span>
  <span id="hud-speed-unit"></span>
  <span id="hud-health-text"></span>
  <span id="hud-money"></span>
  <span id="hud-alert-text"></span>
  <div id="hud-alert-badges"></div>
  <div id="hud-health-fill"></div>
  <div id="hud-car-health"><div id="hud-car-health-fill"></div></div>
  <div id="hud-hint"></div>
  <div id="hud-paused"></div>
  <div id="hud-wasted">
    <h2>WASTED</h2>
    <div id="hud-wasted-money"></div>
    <button id="hud-respawn" type="button">Respawn</button>
  </div>
  <div id="hud-busted">
    <h2>BUSTED</h2>
    <div id="hud-busted-money"></div>
    <button id="hud-busted-respawn" type="button">Respawn</button>
  </div>
</div>

<div id="out"></div>
<div id="summary">running…</div>

<script src="src/config.js"></script>
<script src="src/math.js"></script>
<script src="src/alert.js"></script>
<script src="map/city.js"></script>
<script src="src/input.js"></script>
<script src="src/world.js"></script>
<script src="src/camera.js"></script>
<script src="src/blood.js"></script>
<script src="src/peds.js"></script>
<script src="src/bullet.js"></script>
<script src="src/car.js"></script>
<script src="src/player.js"></script>
<script src="src/police.js"></script>
<script src="src/cleaner.js"></script>
<script src="src/hud.js"></script>
<script src="src/main.js"></script>
<script>
(function () {
  'use strict';

  var out = document.getElementById('out');
  var pass = 0, fail = 0;

  function assert(name, cond, detail) {
    var ok = !!cond;
    if (ok) pass++; else fail++;
    var row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = '<span class="tag ' + (ok ? 'pass' : 'fail') + '">' +
      (ok ? 'PASS' : 'FAIL') + '</span><span>' + name + '</span>' +
      '<span class="detail">' + (detail === undefined ? '' : detail) + '</span>';
    out.appendChild(row);
  }

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function key(type, code) {
    window.dispatchEvent(new KeyboardEvent(type, { code: code, bubbles: true }));
  }

  // The simulation is driven explicitly instead of by requestAnimationFrame so
  // the test is deterministic (and so it works in headless browsers, which do
  // not composite and therefore fire rAF at most once).
  function tick(n) {
    for (var i = 0; i < n; i++) window.CJGame.step(CJ.CFG.DT);
  }

  // Hold a key for n fixed steps, then release it.
  function hold(code, steps) {
    key('keydown', code);
    tick(steps);
    key('keyup', code);
    tick(1);
  }

  // One press that is guaranteed to be seen as an edge trigger.
  function tap(code) {
    key('keydown', code);
    tick(1);
    key('keyup', code);
    tick(1);
  }

  // Shooting is on the mouse now: mousedown lands on the canvas, mouseup is
  // caught on the window (so releasing outside the canvas still stops fire).
  function holdMouse(steps, button) {
    var canvas = document.getElementById('game');
    canvas.dispatchEvent(new MouseEvent('mousedown', {
      button: button === undefined ? 0 : button,
      buttons: 1,
      bubbles: true,
      cancelable: true
    }));
    tick(steps);
    window.dispatchEvent(new MouseEvent('mouseup', {
      button: button === undefined ? 0 : button,
      bubbles: true
    }));
    tick(1);
  }

  function state() { return window.CJGame.getState(); }

  function insideSolid(s, obj, r) { return s.world.isSolidAt(obj.x, obj.y, r); }

  function finish() {
    var summary = document.getElementById('summary');
    summary.textContent = pass + ' passed, ' + fail + ' failed';
    summary.className = fail === 0 ? 'pass' : 'fail';
    window.__SMOKE_RESULT__ = { pass: pass, fail: fail };
    console.log('[carjack smoke] ' + pass + ' passed, ' + fail + ' failed');
  }
function run() {
    tick(2);
    var s = state();

    assert('game booted', !!s && !!s.player, 'player at ' +
      (s ? s.player.x.toFixed(0) + ',' + s.player.y.toFixed(0) : 'none'));
    assert('8 cars spawned', s.cars.length === 8, s.cars.length + ' cars');
    assert('pedestrians spawned', s.pedsAlive === CJ.CFG.PED_COUNT,
      s.pedsAlive + ' people');
    assert('no blood on a fresh city', s.splats === 0);

    // --- walking ---------------------------------------------------------
    var startY = s.player.y;
    hold('ArrowDown', 54);
    s = state();
    assert('ArrowDown walks the player', s.player.y > startY + 10,
      'y ' + startY.toFixed(0) + ' -> ' + s.player.y.toFixed(0));

    var startY2 = s.player.y;
    hold('KeyW', 24);
    s = state();
    assert('WASD also walks the player', s.player.y < startY2 - 5,
      'y ' + startY2.toFixed(0) + ' -> ' + s.player.y.toFixed(0));
    assert('player never ends inside a building',
      !insideSolid(s, s.player, CJ.CFG.P_RADIUS - 1),
      s.player.x.toFixed(0) + ',' + s.player.y.toFixed(0));

    // --- enter car -------------------------------------------------------
    hold('ArrowDown', 42);                 // walk back down to the parked car
    s = state();
    var bestD = 1e9;
    for (var i = 0; i < s.cars.length; i++) {
      var d = CJ.M.dist(s.player.x, s.player.y, s.cars[i].x, s.cars[i].y);
      if (d < bestD) bestD = d;
    }
    tap('KeyE');
    s = state();
    assert('E puts the player in the nearest car', !!s.player.driving,
      'nearest car ' + bestD.toFixed(0) + 'px away');
    if (!s.player.driving) { finish(); return; }
    assert('camera switches to the car', s.cam.target === s.player.driving);

    // --- driving ---------------------------------------------------------
    var car = s.player.driving;
    var cx = car.x, cy = car.y;
    hold('ArrowUp', 72);
    s = state();
    assert('ArrowUp accelerates the car', Math.abs(car.speed) > 20,
      'speed ' + car.speed.toFixed(0));
    assert('the car moved', CJ.M.dist(cx, cy, car.x, car.y) > 30,
      'moved ' + CJ.M.dist(cx, cy, car.x, car.y).toFixed(0) + 'px');
    assert('the car is not inside a building',
      !insideSolid(s, car, CJ.CFG.CAR_RADIUS - 1),
      car.x.toFixed(0) + ',' + car.y.toFixed(0));

    window.CJGame.render();                 // HUD text is refreshed during a frame
    assert('speedometer reports a speed',
      Number(document.getElementById('hud-speed').textContent) > 0,
      document.getElementById('hud-speed').textContent + ' km/h');

    CJ.Bullets.clear();
    holdMouse(15);
    assert('cannot shoot while driving', state().bulletsLive === 0);

    // --- running people over ---------------------------------------------
    s = state();
    var victim = null;
    for (var pi = 0; pi < s.peds.length; pi++) {
      if (!s.peds[pi].dead) { victim = s.peds[pi]; break; }
    }
    victim.state = 'walk';                 // make sure it is on the street
    victim.x = car.x + 40;
    victim.y = car.y;
    var bloodBefore = CJ.Blood.count;
    car.vx = 420; car.vy = 0; car.heading = 0;   // slam into them
    tick(10);
    s = state();
    assert('driving over a pedestrian flattens them', victim.dead === true);
    assert('running someone over leaves a blood splat',
      CJ.Blood.count > bloodBefore, CJ.Blood.count + ' splats');
    assert('the kill is counted', s.kills >= 1, s.kills + ' kills');

    // That kill raised the alert; clear it so a squad car cannot interrupt the
    // rest of the suite (the police tests below set their own heat).
    CJ.Police.reset();

    // --- exit ------------------------------------------------------------
    tap('KeyE');
    s = state();
    assert('E gets the player back out', !s.player.driving);
    assert('exit spot is walkable',
      !insideSolid(s, s.player, CJ.CFG.P_RADIUS - 1),
      s.player.x.toFixed(0) + ',' + s.player.y.toFixed(0));
    assert('camera switches back to the player', s.cam.target === s.player);

    // --- shooting --------------------------------------------------------
    CJ.Bullets.clear();
    holdMouse(15);
    s = state();
    assert('clicking fires bullets on foot', s.bulletsLive > 0, s.bulletsLive + ' live');

    // Right click fires too.
    CJ.Bullets.clear();
    holdMouse(15, 2);
    assert('right-clicking also fires', state().bulletsLive > 0,
      state().bulletsLive + ' live');

    // Space must no longer shoot.
    CJ.Bullets.clear();
    hold('Space', 15);
    assert('Space no longer fires', state().bulletsLive === 0);

    // Holding the button keeps firing (respecting the cooldown).
    CJ.Bullets.clear();
    holdMouse(30);
    assert('holding the button keeps firing', state().bulletsLive > 1,
      state().bulletsLive + ' live');

    // --- pause -----------------------------------------------------------
    tap('KeyP');
    s = state();
    var px = s.player.x, py = s.player.y;
    hold('ArrowRight', 30);
    s = state();
    assert('P freezes the simulation',
      s.paused && s.player.x === px && s.player.y === py,
      'x ' + px.toFixed(1) + ' -> ' + s.player.x.toFixed(1));
    tap('KeyP');
    assert('P resumes the simulation', !state().paused);

    // --- reset -----------------------------------------------------------
    tap('KeyR');
    s = state();
    assert('R resets the player to spawn',
      s.player.x === s.world.playerSpawn.x && s.player.y === s.world.playerSpawn.y);
    assert('R restores all cars', s.cars.length === 8, s.cars.length + ' cars');
    assert('R clears bullets', s.bulletsLive === 0);
    assert('R respawns every pedestrian', s.pedsAlive === CJ.CFG.PED_COUNT,
      s.pedsAlive + ' people');
    assert('R clears the blood', s.splats === 0);

    // --- shooting pedestrians --------------------------------------------
    s = state();
    var target = null;
    for (var ti = 0; ti < s.peds.length; ti++) {
      if (!s.peds[ti].dead) { target = s.peds[ti]; break; }
    }
    // Stand them on the clear sidewalk row in front of the player and fire east.
    target.state = 'walk';
    target.x = s.player.x + 60;
    target.y = s.player.y;
    s.player.aim = 0;
    holdMouse(15);
    s = state();
    assert('shooting a pedestrian kills them', target.dead === true);
    assert('shooting someone leaves a blood splat', s.splats > 0, s.splats + ' splats');
    assert('the on-foot kill is counted', s.kills >= 1, s.kills + ' kills');

    // --- player health ---------------------------------------------------
    assert('health starts full', s.player.hp === CJ.CFG.P_HP, s.player.hp + ' hp');

    // --- car explosion: blast damage falls off with distance ---------------
    s = state();
    var bomb = s.cars[0];
    var px0 = s.player.x, py0 = s.player.y;

    // Far from the player: the blast must not reach.
    bomb.x = px0 + CJ.CFG.EXPLOSION_RADIUS + 400;
    bomb.y = py0;
    bomb.hp = 0;
    tick(1);
    s = state();
    assert('a wrecked car is removed from the world',
      s.cars.indexOf(bomb) === -1, s.cars.length + ' cars left');
    assert('an explosion is spawned', s.explosions.length > 0,
      s.explosions.length + ' explosions');
    assert('a distant explosion does not hurt the player',
      s.player.hp === CJ.CFG.P_HP, s.player.hp + ' hp');

    // Right on top of the blast: the full 30%.
    s = state();
    var bomb2 = s.cars[0];
    bomb2.x = s.player.x;
    bomb2.y = s.player.y;
    bomb2.hp = 0;
    tick(1);
    s = state();
    var nearLoss = CJ.CFG.P_HP - s.player.hp;
    assert('a point-blank explosion takes the full 30%',
      Math.abs(nearLoss - CJ.CFG.P_HP * 0.30) < 0.01,
      'lost ' + nearLoss.toFixed(1) + ' hp');

    // Halfway out: about half of the maximum.
    tap('KeyR');
    s = state();
    var bomb3 = s.cars[0];
    bomb3.x = s.player.x + CJ.CFG.EXPLOSION_RADIUS / 2;
    bomb3.y = s.player.y;
    bomb3.hp = 0;
    tick(1);
    s = state();
    var midLoss = CJ.CFG.P_HP - s.player.hp;
    assert('a mid-range explosion takes about half of that',
      Math.abs(midLoss - CJ.CFG.P_HP * 0.15) < 1.5,
      'lost ' + midLoss.toFixed(1) + ' hp');

    // --- blowing up the car you are sitting in ----------------------------
    tap('KeyR');
    tick(2);
    s = state();
    // Walk to the car below the spawn and get in.
    hold('ArrowDown', 54);
    tap('KeyE');
    s = state();
    assert('player is driving before the explosion', !!s.player.driving);
    var drivenCar = s.player.driving;
    drivenCar.hp = 0;
    tick(1);
    s = state();
    assert('the player is thrown out of the exploding car', !s.player.driving);
    assert('being in the exploding car costs half your health',
      Math.abs(s.player.hp - CJ.CFG.P_HP * 0.5) < 0.01,
      s.player.hp.toFixed(1) + ' hp left');
    assert('the exploded car is gone', s.cars.indexOf(drivenCar) === -1);

    // --- money ------------------------------------------------------------
    tap('KeyR');
    tick(2);
    s = state();
    assert('you start with $100', s.money === 100, '$' + s.money);
    assert('the HUD shows the cash', /\$100/.test(document.getElementById('hud-money').textContent),
      document.getElementById('hud-money').textContent);

    // --- dying: WASTED overlay, no respawn until you click ----------------
    tap('KeyR');
    tick(2);
    s = state();
    var hospitalSpawn = s.world.hospitalSpawn;
    var deathSpot = { x: s.player.x, y: s.player.y };

    window.CJGame.damage(1000);             // wipe the player out
    tick(1);
    s = state();
    assert('running out of health puts you in the wasted state', s.dead === true);
    assert('the WASTED overlay is shown', s.wastedVisible === true);
    assert('dying costs $25', s.money === 75, '$' + s.money);
    window.CJGame.render();
    assert('the wasted overlay names the cost',
      /25/.test(document.getElementById('hud-wasted-money').textContent),
      document.getElementById('hud-wasted-money').textContent);

    // The world keeps running, but you have no control and do not move.
    hold('ArrowRight', 30);
    holdMouse(10);
    s = state();
    assert('you cannot move while wasted',
      Math.abs(s.player.x - deathSpot.x) < 0.01 && Math.abs(s.player.y - deathSpot.y) < 0.01,
      s.player.x.toFixed(1) + ',' + s.player.y.toFixed(1));
    assert('you cannot shoot while wasted', s.bulletsLive === 0);
    assert('you are not respawned until you click',
      Math.abs(s.player.x - hospitalSpawn.x) > 1 || Math.abs(s.player.y - hospitalSpawn.y) > 1);

    // --- clicking the button respawns you at the hospital -----------------
    document.getElementById('hud-respawn').click();
    tick(1);
    s = state();
    assert('clicking respawn clears the wasted state', s.dead === false);
    assert('clicking respawn hides the overlay', s.wastedVisible === false);
    assert('you respawn outside the hospital',
      Math.abs(s.player.x - hospitalSpawn.x) < 1 && Math.abs(s.player.y - hospitalSpawn.y) < 1,
      s.player.x.toFixed(0) + ',' + s.player.y.toFixed(0));
    assert('you respawn at full health', s.player.hp === CJ.CFG.P_HP, s.player.hp + ' hp');
    assert('the respawn point is walkable',
      !s.world.isSolidAt(s.player.x, s.player.y, CJ.CFG.P_RADIUS - 1));
    assert('respawned money is unchanged', s.money === 75, '$' + s.money);
    hold('ArrowRight', 20);
    s = state();
    assert('you have control again after respawning', s.player.x !== hospitalSpawn.x);

    // --- you can never go below $0 ---------------------------------------
    tap('KeyR');
    tick(2);
    s = state();
    s.player.money = 10;                    // less than the death cost
    window.CJGame.damage(1000);
    tick(1);
    s = state();
    assert('the wallet is floored at $0', s.money === 0, '$' + s.money);

    tap('KeyR');
    tick(2);
    s = state();
    s.player.money = 0;
    window.CJGame.damage(1000);
    tick(1);
    s = state();
    assert('dying broke does not go negative', s.money === 0, '$' + s.money);
    document.getElementById('hud-respawn').click();
    tick(1);
    assert('you can still respawn with no money', state().dead === false);

    // --- R clears the overlay too ----------------------------------------
    tap('KeyR');
    tick(2);
    window.CJGame.damage(1000);
    tick(1);
    assert('reset while wasted works', state().wastedVisible === true);
    tap('KeyR');
    tick(2);
    s = state();
    assert('R clears the wasted state', s.dead === false && s.wastedVisible === false);
    assert('R restores your starting cash', s.money === 100, '$' + s.money);

    // --- alert meter and the police response -----------------------------
    tap('KeyR');
    tick(2);
    s = state();
    assert('the alert meter starts empty', s.alert === 0 && !s.police.active,
      'alert ' + s.alert);
    window.CJGame.render();
    assert('the HUD paints five shields',
      document.querySelectorAll('#hud-alert-badges .badge').length === CJ.CFG.ALERT_BADGES,
      document.querySelectorAll('#hud-alert-badges .badge').length + ' shields');
    assert('the HUD starts at zero',
      document.getElementById('hud-alert-text').textContent === '0',
      document.getElementById('hud-alert-text').textContent);

    window.CJGame.addHeat(CJ.CFG.ALERT_RUN_OVER + CJ.CFG.ALERT_SHOOT_HIT);
    window.CJGame.render();
    s = state();
    assert('running someone over and shooting raises the meter', s.alert === 22,
      'alert ' + s.alert);
    assert('the HUD shows the new alert',
      document.getElementById('hud-alert-text').textContent === '22',
      document.getElementById('hud-alert-text').textContent);
    assert('the first shield lights up and the second does not', (function () {
      var shields = document.querySelectorAll('#hud-alert-badges .badge');
      return shields[0].className.indexOf('on') !== -1 &&
             shields[1].className.indexOf('on') === -1;
    })());

    // The station takes a moment to dispatch, then a car comes looking.
    tick(Math.ceil(CJ.CFG.POLICE_CALL_DELAY / CJ.CFG.DT) + 4);
    s = state();
    var policeCar = s.police.car;
    var station = s.world.policeStation;
    var stationX = station.x + station.w / 2;
    var stationY = station.y + station.h / 2;
    assert('the second badge sends a police car', !!policeCar && s.police.cops === 2,
      policeCar ? s.police.cops + ' officers' : 'no car');
    assert('the squad car is in the world', !!policeCar && s.cars.indexOf(policeCar) !== -1);
    assert('the squad car came from the station', !!policeCar &&
      CJ.M.dist(policeCar.x, policeCar.y, stationX, stationY) < s.world.tile * 8,
      policeCar ? CJ.M.dist(policeCar.x, policeCar.y, stationX, stationY).toFixed(0) + 'px' : 'none');

    var chaseFrom = CJ.M.dist(policeCar.x, policeCar.y, s.player.x, s.player.y);
    tick(120);
    s = state();
    var chaseTo = CJ.M.dist(policeCar.x, policeCar.y, s.player.x, s.player.y);
    assert('the squad car closes in on you', chaseTo < chaseFrom - 100,
      chaseFrom.toFixed(0) + ' -> ' + chaseTo.toFixed(0) + 'px');

    // Park the squad car next to the player: the officers should pile out.
    policeCar.x = s.player.x + 26;
    policeCar.y = s.player.y;
    policeCar.vx = 0;
    policeCar.vy = 0;
    policeCar.speed = 0;
    tick(2);
    s = state();
    assert('officers jump out of the car', s.police.deployed && s.police.afoot === 2,
      s.police.afoot + ' afoot');

    tick(120);
    s = state();
    assert('officers grab you and bust you', s.busted === true && s.bustedVisible === true,
      'bust timer ' + s.police.bustTimer.toFixed(2));
    assert('a bust takes $50 bail', s.money === 50, '$' + s.money);
    assert('being busted empties the alert', s.alert === 0, 'alert ' + s.alert);
    assert('the squad car is stood down after a bust', !s.police.active);

    document.getElementById('hud-busted-respawn').click();
    tick(1);
    s = state();
    assert('the busted overlay clears on release',
      s.busted === false && s.bustedVisible === false);
    assert('you are released outside the police station',
      Math.abs(s.player.x - s.world.policeSpawn.x) < 1 &&
      Math.abs(s.player.y - s.world.policeSpawn.y) < 1,
      s.player.x.toFixed(0) + ',' + s.player.y.toFixed(0));
    assert('you are patched up after a bust', s.player.hp === CJ.CFG.P_HP, s.player.hp + ' hp');

    // Being grabbed while driving pulls you out of the car.
    tap('KeyR');
    tick(2);
    s = state();
    var parked = s.cars[0];
    s.player.x = parked.x + 20;
    s.player.y = parked.y;
    tick(1);
    tap('KeyE');
    s = state();
    assert('test setup: player is driving', !!s.player.driving);
    window.CJGame.bust();
    tick(1);
    s = state();
    assert('a bust pulls you out of the car',
      s.player.driving === null && s.busted === true);
    assert('the bail is charged for a car bust', s.money === 50, '$' + s.money);
    document.getElementById('hud-busted-respawn').click();
    tick(1);
    assert('you can move again after release',
      (function () { hold('ArrowRight', 20); return state().player.x !== s.world.policeSpawn.x; })());

    // --- reinforcements: one car for every filled badge -------------------
    tap('KeyR');
    tick(2);
    window.CJGame.addHeat(CJ.CFG.ALERT_CHASE_AT * 3);   // three badges
    tick(225);                                          // dispatch + two more
    s = state();
    var policeOnRoad = s.cars.filter(function (c) { return c.police; }).length;
    assert('three filled badges send three squad cars', s.police.cars === 3,
      s.police.cars + ' cars');
    assert('every squad car is a police car in the world',
      policeOnRoad === 3, policeOnRoad + ' police cars');
    assert('each squad car brings two officers', s.police.cops === 6,
      s.police.cops + ' officers');
    assert('the reinforcements left the station one at a time', (function () {
      // All three are on the road, facing along it, and none share a spot.
      for (var a = 0; a < CJ.Police.units.length; a++) {
        for (var b = a + 1; b < CJ.Police.units.length; b++) {
          var ca = CJ.Police.units[a].car;
          var cb = CJ.Police.units[b].car;
          if (!ca || !cb) continue;
          if (CJ.M.dist(ca.x, ca.y, cb.x, cb.y) < 1) return false;
        }
      }
      return true;
    })());
    window.CJGame.render();

    // --- rendering must not throw ----------------------------------------
    tap('F1');
    var debugFrame = true;
    try { window.CJGame.render(); } catch (e) { debugFrame = false; }
    assert('the debug overlay renders the alert and police state',
      debugFrame && state().debug === true);
    tap('F1');

    var rendered = true;
    try { window.CJGame.render(); } catch (e) { rendered = false; }
    assert('a full frame renders without throwing', rendered);

    finish();
  }

  function start() {
    try {
      run();
    } catch (err) {
      var box = document.getElementById('summary');
      box.textContent = 'ERROR: ' + (err && err.message) + ' @ ' +
        (err && err.stack ? err.stack.split('\n')[1] : '');
      box.className = 'fail';
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();
</script>
</body>
</html>
