<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carjack — geometric prototype</title>
<style>
  :root {
    color-scheme: dark;
    --panel: rgba(10, 12, 16, 0.62);
    --line: rgba(255, 255, 255, 0.14);
    --text: #e6e9ee;
    --dim: #9aa3ae;
    --accent: #ffd15c;
  }

  html, body {
    margin: 0;
    height: 100%;
    background: #0b0d10;
    overflow: hidden;
    font: 12px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  #game {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: crosshair;
    touch-action: none;
  }

  #hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    user-select: none;
  }

  .panel {
    position: absolute;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 12px;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
  }

  #panel-status {
    left: 16px;
    top: 16px;
    min-width: 168px;
  }

  .mode {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    padding: 2px 7px;
    border-radius: 999px;
    margin-bottom: 7px;
  }
  .mode.foot    { background: rgba(120, 190, 255, 0.16); color: #8ecbff; }
  .mode.driving { background: rgba(126, 224, 129, 0.16); color: #7ee081; }

  .speed-row {
    display: flex;
    align-items: baseline;
    gap: 5px;
    font-variant-numeric: tabular-nums;
  }
  #hud-speed {
    font-size: 26px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.02em;
  }
  #hud-speed-unit {
    font-size: 10px;
    color: var(--dim);
    letter-spacing: 0.08em;
    transition: opacity 0.2s;
  }

  .bar {
    position: relative;
    height: 5px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.12);
    overflow: hidden;
    margin-top: 7px;
  }
  .bar > div {
    height: 100%;
    width: 100%;
    border-radius: 3px;
    transition: width 0.15s linear;
  }
  #hud-health-fill { background: linear-gradient(90deg, #48d17a, #8ff0a4); }
  #hud-car-health { display: none; margin-top: 6px; }
  #hud-car-health-fill { background: linear-gradient(90deg, #d1a248, #ffd15c); }

  /* ---- alert meter: five police shields ---- */
  .badges {
    display: flex;
    gap: 4px;
    margin-top: 3px;
    height: 21px;
  }
  .badge {
    width: 17px;
    height: 21px;
    --fill: 0%;
    background: linear-gradient(90deg,
      #ffd15c 0%, #ffd15c var(--fill),
      rgba(255, 255, 255, 0.12) var(--fill),
      rgba(255, 255, 255, 0.12) 100%);
    clip-path: polygon(50% 0%, 100% 16%, 100% 64%, 50% 100%, 0% 64%, 0% 16%);
    transition: background 0.12s linear;
  }
  .badge.on {
    filter: drop-shadow(0 0 5px rgba(255, 209, 92, 0.65));
    animation: badge-pop 0.3s ease-out;
  }
  .badge.alerted {
    background: linear-gradient(90deg,
      #ff8a5c 0%, #ff8a5c var(--fill),
      rgba(255, 255, 255, 0.12) var(--fill),
      rgba(255, 255, 255, 0.12) 100%);
  }
  @keyframes badge-pop {
    from { transform: scale(1.35); }
    to   { transform: scale(1); }
  }

  .lbl {
    font-size: 9px;
    letter-spacing: 0.14em;
    color: var(--dim);
    text-transform: uppercase;
    margin-bottom: 2px;
  }

  #panel-legend {
    left: 16px;
    bottom: 16px;
    max-width: 58vw;
    color: var(--dim);
    font-size: 11px;
  }
  #panel-legend b {
    color: var(--accent);
    font-weight: 600;
  }
  #hud-hint { color: #c3cad4; }

  #hud-paused {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.3em;
    color: rgba(255, 255, 255, 0.72);
    background: rgba(6, 8, 11, 0.45);
  }

  .money-row {
    display: flex;
    align-items: baseline;
    gap: 5px;
    margin-bottom: 2px;
  }
  #hud-money {
    font-size: 18px;
    font-weight: 700;
    color: #8ff0a4;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }

  /* ---- WASTED / BUSTED overlays ---- */
  #hud-wasted, #hud-busted {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: rgba(10, 4, 6, 0.72);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    pointer-events: auto;
    animation: wasted-in 0.35s ease-out;
  }
  #hud-busted { background: rgba(4, 8, 18, 0.74); }
  @keyframes wasted-in {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  #hud-wasted h2, #hud-busted h2 {
    margin: 0;
    font-size: clamp(44px, 11vw, 104px);
    font-weight: 800;
    letter-spacing: 0.06em;
    line-height: 1;
    color: #ff4a38;
    text-shadow:
      0 0 2px #2a0402,
      0 2px 0 #6d0f08,
      0 4px 0 #3d0704,
      0 0 30px rgba(255, 74, 56, 0.75),
      0 12px 44px rgba(0, 0, 0, 0.75);
    transform: rotate(-2deg);
  }
  #hud-busted h2 {
    color: #5b9bff;
    text-shadow:
      0 0 2px #041029,
      0 2px 0 #0b2b6d,
      0 4px 0 #06183d,
      0 0 30px rgba(91, 155, 255, 0.75),
      0 12px 44px rgba(0, 0, 0, 0.75);
  }

  #hud-wasted-money, #hud-busted-money {
    font-size: 13px;
    letter-spacing: 0.16em;
    color: #ffb9ae;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    font-variant-numeric: tabular-nums;
  }
  #hud-busted-money { color: #b9d4ff; }

  #hud-respawn, #hud-busted-respawn {
    margin-top: 8px;
    padding: 11px 30px;
    font: inherit;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #12161c;
    background: linear-gradient(180deg, #f2f5f8, #c9d2dc);
    border: 1px solid rgba(255, 255, 255, 0.7);
    border-radius: 8px;
    cursor: pointer;
    pointer-events: auto;
    box-shadow: 0 6px 0 rgba(0, 0, 0, 0.35), 0 10px 24px rgba(0, 0, 0, 0.45);
    transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.15s;
  }
  #hud-respawn:hover, #hud-busted-respawn:hover {
    background: linear-gradient(180deg, #fff, #dbe4ee);
  }
  #hud-respawn:active, #hud-busted-respawn:active {
    transform: translateY(3px);
    box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35), 0 6px 14px rgba(0, 0, 0, 0.45);
  }
  #hud-respawn:focus-visible, #hud-busted-respawn:focus-visible {
    outline: 2px solid #ffd15c;
    outline-offset: 3px;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="panel" id="panel-status">
    <span class="mode foot" id="hud-mode">ON FOOT</span>
    <div class="lbl">Cash</div>
    <div class="money-row"><span id="hud-money">$100</span></div>
    <div class="lbl">Speed</div>
    <div class="speed-row">
      <span id="hud-speed">0</span>
      <span id="hud-speed-unit">km/h</span>
    </div>
    <div class="lbl">Health <span id="hud-health-text">100</span></div>
    <div class="bar"><div id="hud-health-fill"></div></div>
    <div id="hud-car-health">
      <div class="lbl">Chassis</div>
      <div class="bar"><div id="hud-car-health-fill"></div></div>
    </div>
    <div class="lbl">Alert <span id="hud-alert-text">0</span></div>
    <div class="badges" id="hud-alert-badges" aria-hidden="true"></div>
  </div>

  <div class="panel" id="panel-legend">
    <div id="hud-hint">ARROWS / WASD run · MOUSE aim &amp; CLICK shoot · E enter car</div>
  </div>

  <div id="hud-paused">PAUSED</div>

  <div id="hud-wasted">
    <h2>WASTED</h2>
    <div id="hud-wasted-money">-$25</div>
    <button id="hud-respawn" type="button">Respawn at hospital</button>
  </div>

  <div id="hud-busted">
    <h2>BUSTED</h2>
    <div id="hud-busted-money">-$50</div>
    <button id="hud-busted-respawn" type="button">Respawn at police station</button>
  </div>
</div>

<!-- Classic scripts, dependency order, no build step. -->
<script src="src/config.js"></script>
<script src="src/math.js"></script>
<script src="src/alert.js"></script>
<script src="map/city.js"></script>
<script src="src/input.js"></script>
<script src="src/world.js"></script>
<script src="src/camera.js"></script>
<script src="src/blood.js"></script>
<script src="src/peds.js"></script>
<script src="src/bullet.js"></script>
<script src="src/car.js"></script>
<script src="src/player.js"></script>
<script src="src/police.js"></script>
<script src="src/cleaner.js"></script>
<script src="src/hud.js"></script>
<script src="src/main.js"></script>
</body>
</html>
