<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carjack — geometric prototype</title>
<style>
  :root {
    color-scheme: dark;
    --panel: rgba(10, 12, 16, 0.62);
    --line: rgba(255, 255, 255, 0.14);
    --text: #e6e9ee;
    --dim: #9aa3ae;
    --accent: #ffd15c;
  }

  html, body {
    margin: 0;
    height: 100%;
    background: #0b0d10;
    overflow: hidden;
    font: 12px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  #game {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: crosshair;
    touch-action: none;
  }

  #hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    user-select: none;
  }

  .panel {
    position: absolute;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 12px;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
  }

  #panel-status {
    left: 16px;
    top: 16px;
    min-width: 168px;
  }

  .mode {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    padding: 2px 7px;
    border-radius: 999px;
    margin-bottom: 7px;
  }
  .mode.foot    { background: rgba(120, 190, 255, 0.16); color: #8ecbff; }
  .mode.driving { background: rgba(126, 224, 129, 0.16); color: #7ee081; }

  .speed-row {
    display: flex;
    align-items: baseline;
    gap: 5px;
    font-variant-numeric: tabular-nums;
  }
  #hud-speed {
    font-size: 26px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.02em;
  }
  #hud-speed-unit {
    font-size: 10px;
    color: var(--dim);
    letter-spacing: 0.08em;
    transition: opacity 0.2s;
  }

  .bar {
    position: relative;
    height: 5px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.12);
    overflow: hidden;
    margin-top: 7px;
  }
  .bar > div {
    height: 100%;
    width: 100%;
    border-radius: 3px;
    transition: width 0.15s linear;
  }
  #hud-health-fill { background: linear-gradient(90deg, #48d17a, #8ff0a4); }
  #hud-car-health { display: none; margin-top: 6px; }
  #hud-car-health-fill { background: linear-gradient(90deg, #d1a248, #ffd15c); }

  .lbl {
    font-size: 9px;
    letter-spacing: 0.14em;
    color: var(--dim);
    text-transform: uppercase;
    margin-bottom: 2px;
  }

  #panel-legend {
    left: 16px;
    bottom: 16px;
    max-width: 58vw;
    color: var(--dim);
    font-size: 11px;
  }
  #panel-legend b {
    color: var(--accent);
    font-weight: 600;
  }
  #hud-hint { color: #c3cad4; }

  #hud-paused {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.3em;
    color: rgba(255, 255, 255, 0.72);
    background: rgba(6, 8, 11, 0.45);
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="panel" id="panel-status">
    <span class="mode foot" id="hud-mode">ON FOOT</span>
    <div class="lbl">Speed</div>
    <div class="speed-row">
      <span id="hud-speed">0</span>
      <span id="hud-speed-unit">km/h</span>
    </div>
    <div class="bar"><div id="hud-health-fill"></div></div>
    <div id="hud-car-health">
      <div class="lbl">Chassis</div>
      <div class="bar"><div id="hud-car-health-fill"></div></div>
    </div>
  </div>

  <div class="panel" id="panel-legend">
    <div id="hud-hint">ARROWS / WASD run · MOUSE aim &amp; CLICK shoot · E enter car</div>
  </div>

  <div id="hud-paused">PAUSED</div>
</div>

<!-- Classic scripts, dependency order, no build step. -->
<script src="src/config.js"></script>
<script src="src/math.js"></script>
<script src="map/city.js"></script>
<script src="src/input.js"></script>
<script src="src/world.js"></script>
<script src="src/camera.js"></script>
<script src="src/blood.js"></script>
<script src="src/peds.js"></script>
<script src="src/bullet.js"></script>
<script src="src/car.js"></script>
<script src="src/player.js"></script>
<script src="src/hud.js"></script>
<script src="src/main.js"></script>
</body>
</html>
